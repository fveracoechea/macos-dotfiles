set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1
# default-shell must be set before any new-session.
set  -g default-shell "/bin/zsh"

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     50000

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-powerkit'
source-file ~/.config/tmux/powerkit.conf
# TPM runs here, not at the end, so the settings below override the plugins,
# the same order Home Manager used.
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# general
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Reset default command
set-option -g default-command ""

# Renumber all windows when any window is closed
set -g renumber-windows on

# Vi mode for copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

# Pane Controls
bind x kill-pane

# Split horizontally with |
unbind %
bind '\' split-window -h

# Split vertically with -
unbind '"'
bind '-' split-window -v

# Resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane toggle using m
bind -r m resize-pane -Z

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'

# Adds spacing to the tmux status bar
set -g status 2
set -g status-format[1] ""
