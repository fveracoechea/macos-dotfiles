name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the check tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install just stow shellcheck stylua luacheck jq check-jsonschema opencode herdr \
            neovim tree-sitter-cli lua-language-server biome oxfmt stylelint typescript \
            vscode-langservers-extracted tailwindcss-language-server prettier black isort \
            imagemagick fd fzf ripgrep gh lazygit bun
          export BUN_INSTALL="$HOME/.bun"
          bun add -g graphql-language-service-cli@3.5.0 @stylelint/language-server@1.1.1 oxlint@1.88.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: just check
